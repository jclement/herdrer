# Release. Triggered by a v* tag, which is pushed by `mise run release` — never
# by hand, and never to work around a red pipeline.
#
# THIS FILE'S NAME IS PART OF THE SECURITY CONTRACT. scripts/install.sh verifies
# the cosign bundle against the certificate identity
#
#   ^https://github\.com/jclement/herdrer/\.github/workflows/release\.yml@refs/tags/v
#
# so renaming this file, or moving the signing step into a reusable workflow,
# invalidates every signature every installer in the field knows how to check.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege at the top; the release job widens it, the gate job does not.
permissions:
  contents: read

jobs:
  # A tag must not be able to produce a release if the tests fail. This is the
  # same gate ci.yml runs on every push, duplicated rather than pulled in with
  # workflow_call: this is the one file whose name and contents install.sh
  # pins a signing identity against, and it is worth being readable end to end
  # without chasing a `uses:` into another file. The cost is that a change to
  # the gate has to be made in two places; ci.yml says so too.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v4

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Cache bun store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: mise run setup

      # Before anything compiles Go: internal/webui/dist is a build output.
      - run: mise run build

      - run: mise run check

      # Release builds are CGO_ENABLED=0; -race requires cgo, so it is turned
      # back on for this step only.
      - name: Go tests with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    name: release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # OIDC token for keyless cosign and for attestation
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history and every tag to compute the
          # version and build a changelog against the previous release.
          fetch-depth: 0

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v4

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Cache bun store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # go mod download and bun install. The SPA build itself is a GoReleaser
      # before-hook, not a step here, so that a local `goreleaser release
      # --snapshot` embeds a real SPA too — the "green build, blank page"
      # failure mode is worth guarding in both places. See .goreleaser.yml.
      - run: mise run setup

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A GitHub PAT with write access to jclement/homebrew-tap. It is the
          # only repository secret this project needs — there is no Cloudflare
          # deploy here (unlike herdr-web, herdrer has no relay Worker) and no
          # registry login, because there are no container images. No secret is
          # available to ci.yml or to any pull-request build.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # The middle tier of install.sh's verification ladder. Attesting the
      # checksums file rather than a glob of paths registers every artifact
      # listed inside it as a subject, so `gh attestation verify <tarball>`
      # resolves by the tarball's own digest — which is what the installer
      # actually runs.
      #
      # This lands a few seconds after the release is published, so a download
      # that wins that race sees the gh tier fail. install.sh warns rather than
      # dies there and falls through to the checksum, which is the right
      # behaviour; the cosign tier above is unaffected because GoReleaser
      # signs before it uploads.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
